<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Forest of Keys: get ready for the COS212 binary search tree lecture." />
    <meta name="theme-color" content="#1d5c50" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forest of Keys" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Forest of Keys</title>
    <script>
      // Apply saved display settings before the first paint (no flash of the wrong theme).
      try {
        var s = JSON.parse(localStorage.getItem('forest-of-keys:settings') || '{}');
        // ?theme=light|dark overrides (useful when presenting); saved by the app on load.
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark') { s.theme = q; localStorage.setItem('forest-of-keys:settings', JSON.stringify(s)); }
        var el = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') el.dataset.theme = s.theme;
        if (s.text) el.dataset.text = s.text;
        if (s.motion) el.dataset.motion = s.motion;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
